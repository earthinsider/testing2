<!--
  TEMPLATE — do not deploy as-is.
  n8n duplicates this file to /category/[[CATEGORY_SLUG]].html for every
  entry in tools-data.json's "categories" array, replacing the bracketed
  placeholders below via the GitHub Contents API — same pattern as the
  Blogger post pipeline.

  The tool cards themselves are NOT rendered server-side: script.js reads
  window.TOOLBENCH_CATEGORY and filters tools-data.json client-side, so
  adding/removing tools only ever touches ONE file (tools-data.json),
  never the category pages.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[[CATEGORY_NAME]] — Toolbench</title>
<meta name="description" content="[[CATEGORY_DESCRIPTION]]">
<link rel="canonical" href="https://tools.earthinsider.in/category/[[CATEGORY_SLUG]].html">
<link rel="alternate" type="application/rss+xml" title="Toolbench RSS" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>window.TOOLBENCH_CATEGORY = "[[CATEGORY_SLUG]]"; window.TOOLBENCH_DATA_URL = "/tools-data.json";</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/">TOOLBENCH</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark and light theme">◐ light</button>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <p class="breadcrumb"><a href="/">Home</a> / [[CATEGORY_NAME]]</p>
    <p class="eyebrow">Category</p>
    <h1>[[CATEGORY_NAME]]</h1>
    <p>[[CATEGORY_DESCRIPTION]]</p>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search within [[CATEGORY_NAME]]" aria-label="Search tools">
    </div>
  </div>
</section>

<section class="tools-section">
  <div class="wrap">
    <nav class="pegboard-nav" id="pegboard-nav" aria-label="Other categories"></nav>
    <div class="breadcrumb" id="result-count" aria-live="polite"></div>
    <div class="tools-grid" id="tools-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>© <span id="year"></span> Toolbench · EarthInsider</span>
    <div class="footer-links">
      <a href="/feed.xml">RSS</a>
      <a href="/sitemap.xml">Sitemap</a>
    </div>
  </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="/script.js"></script>
</body>
</html>
